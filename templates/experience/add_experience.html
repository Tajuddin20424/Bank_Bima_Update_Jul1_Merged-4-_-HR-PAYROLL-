{% extends 'base.html' %}
{% load static %}

{% block title %}Add Experience{% endblock %} 

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Experience</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="row">
      
      <!-- Left: Add Experience Form -->
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2>Add Experience</h2>
          <form id="addForm" method="POST">
            {% csrf_token %}

            <input type="hidden" id="exp_id">

            <div class="mb-3">
              <label class="form-label fw-semibold">Employee ID</label>
              <input type="text" id="emp_id" name="emp_id" class="form-control" placeholder="Enter employee id" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Company Name</label>
              <input type="text" id="company_name" name="company_name" class="form-control" placeholder="Enter company name" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Designation</label>
              <input type="text" id="designation" name="designation" class="form-control" placeholder="Enter designation">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Department</label>
              <input type="text" id="department" name="department" class="form-control" placeholder="Enter department">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Company Location</label>
              <input type="text" id="company_location" name="company_location" class="form-control" placeholder="Enter company location">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Status</label>
              <select name="status" id="status" class="form-select">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>    
            
            <!-- ── Buttons ── -->
            <div class="col-md-12 mt-3 d-flex gap-2">
                <button type="button" id="saveBtn" class="btn btn-primary px-5">
                    💾 Save
                </button>
                <button type="button" id="cancelBtn" class="btn btn-secondary px-4">
                     Cancel
                </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right: Experience List -->
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <div class="table-responsive" style="max-height: 800px; overflow-y: auto;" id="tableContainerRight">
            <table class="table table-bordered table-striped table-hover table-sm custom-border full-width-table" id="staffTableRight">
              <thead class="table-dark" style="position: sticky; top: 0; z-index: 2;">
                <tr>
                  <th>#</th>
                  <th>Employee ID</th>
                  <th>Company Name</th>
                  <th>Designation</th>
                  <th>Department</th>
                  <th>Company Location</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="experienceTableBody">
                <!-- Rows loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>  

</body>
</html>

{% endblock %}

{% block extra_js %}
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="{% static 'js/save_csrftoken.js' %}"></script>
    <script src="{% static 'js/employee_experience_details/load_experience.js' %}"></script>
{% endblock %}
